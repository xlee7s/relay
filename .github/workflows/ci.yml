name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test + lint + build + e2e
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: relaytest
          MYSQL_USER: relaytest
          MYSQL_PASSWORD: relaytest
          MYSQL_ROOT_PASSWORD: relayroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prelayroot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_MYSQL_URL: mysql://relaytest:relaytest@127.0.0.1:3306/relaytest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build (debug, for e2e)
        run: cargo build

      - name: npm ci (frontend)
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Clear TypeScript cache
        run: rm -f tsconfig.tsbuildinfo .tsbuildinfo
        working-directory: frontend

      - name: npm run typecheck (frontend)
        run: npm run typecheck
        working-directory: frontend

      - name: npm run lint (frontend)
        run: npm run lint
        working-directory: frontend

      - name: npm run test (frontend)
        run: npm run test
        working-directory: frontend

      - name: npm run build (frontend)
        run: npm run build
        working-directory: frontend

      # The panel's CSP allows fonts only from 'self', so a font inlined as a
      # data: URI is refused by the browser (see vite.config.ts).
      - name: no font inlined into the built CSS
        run: |
          if grep -l "data:font" dist/assets/*.css; then
            echo "::error::a font was inlined as a data: URI, which the panel's CSP blocks"
            exit 1
          fi
        working-directory: frontend

      - name: e2e test
        run: python3 tests/e2e_test.py
