name: Docker Master

# Every push to master publishes fresh multi-architecture panel and node
# images. Version-tag release workflows remain available for formal releases.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: panel
            target: panel
            arch: amd64
            runner: ubuntu-latest
            version_file: crates/panel/Cargo.toml
          - service: panel
            target: panel
            arch: arm64
            runner: ubuntu-24.04-arm
            version_file: crates/panel/Cargo.toml
          - service: node
            target: node
            arch: amd64
            runner: ubuntu-latest
            version_file: crates/node/Cargo.toml
          - service: node
            target: node
            arch: arm64
            runner: ubuntu-24.04-arm
            version_file: crates/node/Cargo.toml

    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        env:
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' "$VERSION_FILE")
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unable to read a semantic version from $VERSION_FILE"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/relay-${{ matrix.service }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          cache-from: type=gha,scope=master-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=master-${{ matrix.service }}-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.service }} manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: panel
            version_file: crates/panel/Cargo.toml
          - service: node
            version_file: crates/node/Cargo.toml

    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        env:
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' "$VERSION_FILE")
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unable to read a semantic version from $VERSION_FILE"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest manifests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/relay-${{ matrix.service }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:${VERSION}-amd64" \
            "$IMAGE:${VERSION}-arm64"

          OUTPUT=$(docker buildx imagetools inspect "$IMAGE:latest")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'linux/amd64'
          echo "$OUTPUT" | grep -q 'linux/arm64'
